
<div class="text-center w-full flex flex-col m-auto mt-10 mb-10">
    <div class="flex items-center justify-center">
        <button>Download Resume</button>
        @if(isDownloadLoading()){
            <mat-spinner [diameter]="20" class="ml-5"></mat-spinner>
        }@else{
            <mat-icon class="cursor-pointer" (click)="downloadTemplate()" class="ml-5">download</mat-icon>
        }
    </div>
</div>
